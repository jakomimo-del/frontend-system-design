<title>Trainingsbuch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column like a logbook page; sticky day strip, cards per exercise, steppers sized for thumbs. */
:root {
  --bg: #eef0ee;
  --surface: #ffffff;
  --ink: #1b2124;
  --muted: #5f6a6e;
  --line: #d5dad8;
  --accent: #c8341f;          /* 25-kg bumper red */
  --accent-ink: #ffffff;
  --good: #1f7a45;
  --bad: #a3401c;
  --chip: #e2e6e4;
  --d-mo: #c8341f; --d-di: #2a5bb8; --d-mi: #b88a0e; --d-fr: #2f8a4a; --d-sa: #6a4fb0;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15191b; --surface: #1f2427; --ink: #e9ecea; --muted: #9aa5a8; --line: #343b3e;
    --accent: #ec5a42; --accent-ink: #15191b; --good: #57c287; --bad: #f08a62; --chip: #2a3033;
    --d-mo: #ec5a42; --d-di: #6a96ec; --d-mi: #e0b33a; --d-fr: #5cc07a; --d-sa: #a68cf0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15191b; --surface: #1f2427; --ink: #e9ecea; --muted: #9aa5a8; --line: #343b3e;
  --accent: #ec5a42; --accent-ink: #15191b; --good: #57c287; --bad: #f08a62; --chip: #2a3033;
  --d-mo: #ec5a42; --d-di: #6a96ec; --d-mi: #e0b33a; --d-fr: #5cc07a; --d-sa: #a68cf0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 64px; display: grid; gap: 16px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 30px; text-transform: uppercase; }
h2 { font-size: 22px; }
h3 { font-size: 19px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.status { font-size: 13px; color: var(--muted); }
.status.err { color: var(--bad); }
.tabs { display: flex; gap: 4px; background: var(--chip); padding: 4px; border-radius: 10px; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 8px 6px; border-radius: 7px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.days { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 6px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.day { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 2px; display: grid; justify-items: center; gap: 1px; }
.day b { font-family: var(--f-display); font-size: 18px; line-height: 1; }
.day small { font-size: 11px; color: var(--muted); white-space: nowrap; }
.day[aria-pressed="true"] { border-color: var(--dc); box-shadow: inset 0 -3px 0 var(--dc); }
.day.rest { opacity: .55; }
.dayhead { display: grid; gap: 6px; }
.dayhead .row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.dayhead input[type="date"] { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 8px; }
.progress { font-size: 13px; color: var(--muted); }
.list { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
.card.done { border-color: var(--good); }
.card-head { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; }
.card-head > div { min-width: 0; }
.meta { font-size: 13px; color: var(--muted); }
.check { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--line); background: transparent; display: grid; place-items: center; font-size: 20px; font-weight: 700; color: var(--muted); }
.card.done .check { background: var(--good); border-color: var(--good); color: var(--surface); }
.fields { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; }
.field { display: grid; gap: 4px; }
.lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.stepper { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stepper button { width: 40px; border: 0; background: var(--chip); font-size: 20px; font-weight: 600; }
.stepper input { width: 64px; border: 0; text-align: center; font: inherit; font-size: 18px; font-weight: 600; background: var(--surface); color: var(--ink); padding: 8px 0; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.reps { display: flex; gap: 6px; flex-wrap: wrap; }
.reps input { width: 48px; border: 1px solid var(--line); border-radius: 8px; text-align: center; font: inherit; font-size: 17px; font-weight: 600; padding: 8px 0; background: var(--surface); color: var(--ink); -moz-appearance: textfield; }
.reps input::-webkit-outer-spin-button, .reps input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.unit { font-size: 13px; color: var(--muted); align-self: center; }
.last { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pill { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--muted); }
.pill.up { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.pill.down { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.pill.pr { background: var(--accent); color: var(--accent-ink); }
.sub { border-top: 1px dashed var(--line); padding-top: 8px; }
.rest-card { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 24px 16px; text-align: center; color: var(--muted); }
.banner { border: 1px solid var(--bad); color: var(--bad); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
select { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 8px; max-width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chartbox { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 8px 4px; }
.chartbox svg { display: block; width: 100%; height: auto; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -110%); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 2px; min-width: 0; }
.stat b { font-family: var(--f-display); font-size: 22px; }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
.empty { color: var(--muted); padding: 20px 12px; text-align: center; }
.sess { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--dc); border-radius: 10px; padding: 12px; display: grid; gap: 6px; }
.sess .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.sess ul { margin: 0; padding-left: 18px; font-size: 14px; color: var(--muted); }
.link { border: 0; background: none; color: var(--bad); font-size: 13px; font-weight: 600; padding: 4px 0; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.btn { border: 1px solid var(--line); background: var(--chip); border-radius: 8px; padding: 6px 12px; font-weight: 600; font-size: 13px; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--surface); }
@media (prefers-reduced-motion: no-preference) { .card, .check { transition: border-color .15s, background .15s; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>Trainingsbuch</h1>
    <span class="status" id="status">Verbinde …</span>
  </header>
  <div id="banner" class="banner" hidden></div>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-log" aria-selected="true" data-view="log">Training</button>
    <button role="tab" id="tab-prog" aria-selected="false" data-view="prog">Fortschritt</button>
    <button role="tab" id="tab-hist" aria-selected="false" data-view="hist">Verlauf</button>
  </nav>
  <section id="view-log"></section>
  <section id="view-prog" hidden></section>
  <section id="view-hist" hidden></section>
</div>

<script>
// ---------- Plan ----------
// mode: total = Gesamtgewicht | perSide = Scheiben pro Seite (+ Stange) | perHand = Kurzhantel je Hand
//       stack = Maschine Full Stack (nur Wdh.) | drop = Drop-Satz (zwei Gewichte) | none = nur abhaken
const EX = {
  smithPress:   { name: "Schulterdrücken schwer", where: "Smith-Maschine", mode: "perSide", bar: 18.5, w: 25, sets: 2, reps: 8, range: "~8" },
  revFly:       { name: "Reverse Butterfly", where: "Maschine · hintere Schulter", mode: "total", w: 56, sets: 3, reps: 10, range: "10" },
  dbCurl:       { name: "Bizeps Curls", where: "Kurzhanteln, gerade", mode: "perHand", w: 12, sets: 2, reps: 10, range: "10–12" },
  skull:        { name: "Skull Crushers", where: "SZ-Stange · Trizeps", mode: "perSide", bar: 0, w: 15, sets: 2, reps: 9, range: "8–10" },
  lateral:      { name: "Seitheben Drop-Satz", where: "Kurzhanteln · erst schwer, dann leicht bis Versagen", mode: "drop", w: 12, w2: 8, sets: 2, reps: 8, reps2: 10, range: "8–10, dann bis Versagen" },
  cableCurl:    { name: "Cable Curls einarmig", where: "Kabelzug · je Seite", mode: "total", w: 20, sets: 2, reps: 9, range: "8–10 je Seite" },
  ropePush:     { name: "Trizeps Rope Pushdowns", where: "Kabelzug, Seil", mode: "total", w: 23, sets: 2, reps: 10, range: "~10" },
  hackSquat:    { name: "Hack Squat", where: "Maschine", mode: "total", w: 70, sets: 3, reps: 10, range: "10" },
  splitSquat:   { name: "Split Squats", where: "Smith-Maschine · je Bein", mode: "perSide", bar: 18.5, w: 25, sets: 3, reps: 10, range: "10 je Bein" },
  legCurl:      { name: "Leg Curls", where: "Maschine · Hamstrings · Full Stack", mode: "stack", sets: 3, reps: 10, range: "10" },
  legExt:       { name: "Leg Extensions", where: "Maschine · Quads", mode: "total", unit: "lb", w: 190, sets: 3, reps: 10, range: "10" },
  abAd:         { name: "Abduktoren / Adduktoren", where: "Kombi-Maschine", mode: "none", sets: 1, reps: 10, range: "1 × 10" },
  calves:       { name: "Wadenheben stehend", where: "Smith-Maschine", mode: "total", w: 140, sets: 3, reps: 10, range: "10" },
  inclinePress: { name: "Incline Press", where: "Kabelturm mit Bank · je Seite", mode: "total", w: 55, sets: 2, reps: 10, range: "10" },
  frontRow:     { name: "Front Rows", where: "Kabelturm, MAG-Griff (T-Bar-ähnlich)", mode: "total", w: 125, sets: 2, reps: 10, range: "10" },
  butterfly:    { name: "Butterfly", where: "Maschine · Brust", mode: "total", w: 89, sets: 2, reps: 10, range: "10" },
  rackPull:     { name: "Rack Pulls", where: "Langhantel · schwer", mode: "total", w: 100, sets: 2, reps: 10, range: "10" },
};
const ARMS = ["dbCurl", "skull", "lateral", "cableCurl", "ropePush"];
const DAYS = [
  { key: "mo", wd: 1, short: "Mo", name: "Schultern & Arme", tag: "A", ex: ["smithPress", ...ARMS] },
  { key: "di", wd: 2, short: "Di", name: "Beine", tag: "A", ex: ["hackSquat", "legCurl", "legExt", "abAd", "calves"] },
  { key: "mi", wd: 3, short: "Mi", name: "Brust & Rücken", tag: "", ex: ["inclinePress", "frontRow", "butterfly", "rackPull"] },
  { key: "do", wd: 4, short: "Do", name: "Pause", rest: true, ex: [] },
  { key: "fr", wd: 5, short: "Fr", name: "Schultern & Arme", tag: "B", ex: ["revFly", ...ARMS] },
  { key: "sa", wd: 6, short: "Sa", name: "Beine", tag: "B", ex: ["splitSquat", "legCurl", "legExt", "calves"] },
  { key: "so", wd: 0, short: "So", name: "Pause", rest: true, ex: [] },
];
const DAY = Object.fromEntries(DAYS.map(d => [d.key, d]));
const LB = 0.45359237;

// ---------- Helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = n => String(n).padStart(2, "0");
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fmtDate = iso => { const [y, m, d] = iso.split("-"); return `${d}.${m}.${y.slice(2)}`; };
const wdName = iso => ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"][new Date(iso + "T12:00").getDay()];
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; };
const fmtN = n => (Math.round(n * 10) / 10).toLocaleString("de-DE");
const dayOfDate = iso => DAYS.find(d => d.wd === new Date(iso + "T12:00").getDay());

// Effective load in kg for one rep (used for comparison, charts, volume)
function loadKg(ex, e) {
  if (!e || e.w == null) return null;
  const w = num(e.w);
  if (ex.mode === "perSide") return 2 * w + (ex.bar || 0);
  if (ex.unit === "lb") return w * LB;
  return w;
}
function weightText(ex, e) {
  if (ex.mode === "stack") return "Full Stack";
  if (ex.mode === "none") return "";
  if (ex.mode === "perSide") return `${fmtN(e.w)} kg/Seite` + (ex.bar ? ` (${fmtN(loadKg(ex, e))} kg ges.)` : "");
  if (ex.mode === "perHand") return `${fmtN(e.w)} kg je Hantel`;
  if (ex.mode === "drop") return `${fmtN(e.w)} → ${fmtN(e.w2)} kg`;
  if (ex.unit === "lb") return `${fmtN(e.w)} lb (${fmtN(e.w * LB)} kg)`;
  return `${fmtN(e.w)} kg`;
}
const repsText = (ex, e) => ex.mode === "drop"
  ? (e.reps || []).map((r, i) => `${r}+${(e.reps2 || [])[i] ?? "?"}`).join(", ")
  : (e.reps || []).join(", ");
const totalReps = e => (e.reps || []).reduce((a, b) => a + num(b), 0) + (e.reps2 || []).reduce((a, b) => a + num(b), 0);
function volume(ex, e) {
  const l = loadKg(ex, e);
  if (l == null) return null;
  let v = (e.reps || []).reduce((a, r) => a + num(r) * l, 0);
  if (ex.mode === "drop") v += (e.reps2 || []).reduce((a, r) => a + num(r) * num(e.w2), 0);
  return v;
}
// Best set by estimated 1RM (Epley) — combines weight and reps into one comparable number
function e1rm(ex, e) {
  const l = loadKg(ex, e);
  if (l == null) return null;
  const best = Math.max(0, ...(e.reps || []).map(num));
  return l * (1 + best / 30);
}
function score(ex, e) { return ex.mode === "stack" || ex.mode === "none" ? totalReps(e) : e1rm(ex, e); }

function defaultEntry(id) {
  const ex = EX[id];
  const e = { sets: ex.sets, reps: Array(ex.sets).fill(ex.reps) };
  if (ex.w != null) e.w = ex.w;
  if (ex.mode === "drop") { e.w2 = ex.w2; e.reps2 = Array(ex.sets).fill(ex.reps2); }
  return e;
}

// ---------- State ----------
const state = {
  view: "log",
  date: isoDate(new Date()),
  day: null,
  sessions: [],          // [{id, date, day, entries, updatedAt}]
  progEx: "smithPress",
  metric: "load",
  confirmDel: null,
  db: null,
  ready: false,
};
state.day = dayOfDate(state.date).key;
try { const v = localStorage.getItem("gym.view"); if (v) state.view = v; const p = localStorage.getItem("gym.progEx"); if (p && EX[p]) state.progEx = p; } catch (_) {}

const sessionId = (date, day) => `${date}_${day}`;
let draft = null;          // the session being edited: {date, day, entries}
let dirty = false, saving = false, saveTimer = null;

function loadDraft() {
  const id = sessionId(state.date, state.day);
  const s = state.sessions.find(x => x.id === id);
  draft = { date: state.date, day: state.day, entries: s ? structuredClone(s.entries || {}) : {} };
}
// Most recent entry for an exercise strictly before `date` (any day)
function previous(id, date) {
  for (const s of state.sessions) {               // sorted desc by date
    if (s.date < date && s.entries && s.entries[id]) return { date: s.date, e: s.entries[id] };
  }
  return null;
}
function best(id, beforeDate) {
  let b = null;
  for (const s of state.sessions) {
    if (beforeDate && s.date >= beforeDate) continue;
    const e = s.entries && s.entries[id];
    if (!e) continue;
    const v = score(EX[id], e);
    if (v != null && (b == null || v > b)) b = v;
  }
  return b;
}

function setStatus(text, err) { const el = $("#status"); el.textContent = text; el.classList.toggle("err", !!err); }

function scheduleSave() {
  dirty = true;
  setStatus("Speichert …");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 600);
}
async function flush() {
  if (!state.db) { setStatus("Nicht gespeichert – kein Speicher", true); return; }
  if (saving) { saveTimer = setTimeout(flush, 300); return; }
  if (!dirty) return;
  saving = true; dirty = false;
  const d = draft, id = sessionId(d.date, d.day);
  try {
    const ref = state.db.collection("sessions").doc(id);
    if (Object.keys(d.entries).length === 0) await ref.delete();
    else await ref.set({ date: d.date, day: d.day, entries: d.entries, updatedAt: new Date().toISOString() });
    if (!dirty) setStatus("Gespeichert ✓");
  } catch (e) {
    dirty = true;
    setStatus(e && e.code === "quota_exceeded" ? "Speicher voll – alte Einträge löschen" : "Speichern fehlgeschlagen – nochmal ändern zum Wiederholen", true);
  } finally { saving = false; }
}

// ---------- Training view ----------
function renderLog() {
  const day = DAY[state.day];
  const el = $("#view-log");
  const doneCount = day.ex.filter(id => draft.entries[id]).length;
  let html = `<div class="days" role="group" aria-label="Trainingstag">` + DAYS.map(d =>
    `<button class="day${d.rest ? " rest" : ""}" style="--dc:var(--d-${d.key}, var(--muted))" data-day="${d.key}" aria-pressed="${d.key === state.day}">
      <b>${d.short}</b><small>${d.rest ? "Pause" : esc(shortName(d))}</small></button>`).join("") + `</div>`;
  html += `<div class="dayhead"><div class="row"><h2>${esc(day.name)}${day.tag ? " " + day.tag : ""}</h2>
    <input type="date" id="date" value="${state.date}" max="${isoDate(new Date())}" aria-label="Datum"></div>
    ${day.rest ? "" : `<span class="progress">${doneCount} von ${day.ex.length} Übungen eingetragen · ${wdName(state.date)}, ${fmtDate(state.date)}</span>`}</div>`;
  if (day.rest) {
    html += `<div class="rest-card"><h3>Ruhetag</h3><p>Erholung gehört zum Plan. Oben einen anderen Tag wählen, falls du heute doch trainierst.</p></div>`;
  } else {
    html += `<div class="list">` + day.ex.map(card).join("") + `</div>`;
  }
  el.innerHTML = html;
}
function shortName(d) { return { mo: "Arme A", di: "Beine A", mi: "Brust", fr: "Arme B", sa: "Beine B" }[d.key]; }

function stepper(id, field, val, step, label, unit) {
  return `<div class="field"><span class="lbl">${label}</span><div style="display:flex;gap:6px;align-items:center">
    <div class="stepper"><button data-step="${id}|${field}|-${step}" aria-label="${label} weniger">−</button>
    <input id="${id}-${field}" data-ex="${id}" data-field="${field}" type="number" inputmode="decimal" step="any" value="${val}">
    <button data-step="${id}|${field}|${step}" aria-label="${label} mehr">+</button></div>${unit ? `<span class="unit">${unit}</span>` : ""}</div></div>`;
}
function repsRow(id, field, arr, label) {
  return `<div class="field"><span class="lbl">${label}</span><div class="reps">` +
    arr.map((r, i) => `<input id="${id}-${field}-${i}" data-ex="${id}" data-field="${field}" data-i="${i}" type="number" inputmode="numeric" value="${r}" aria-label="Satz ${i + 1}">`).join("") + `</div></div>`;
}

function card(id) {
  const ex = EX[id];
  const saved = draft.entries[id];
  const prev = previous(id, state.date);
  const e = saved || (prev ? prefillFrom(id, prev.e) : defaultEntry(id));
  const done = !!saved;
  const step = ex.unit === "lb" ? 5 : ex.mode === "perSide" ? 1.25 : ex.mode === "perHand" || ex.mode === "drop" ? 1 : 2.5;
  let fields = "";
  if (ex.mode === "none") {
    fields = `<div class="meta">${ex.sets} × ${ex.reps} · Gewicht wird nicht getrackt. Einfach abhaken.</div>`;
  } else {
    fields = `<div class="fields">`;
    if (ex.mode !== "stack") {
      const unit = ex.mode === "perSide" ? "kg/Seite" : ex.mode === "perHand" ? "kg je Hantel" : ex.unit === "lb" ? "lb" : "kg";
      fields += stepper(id, "w", e.w, step, ex.mode === "drop" ? "Schwer" : "Gewicht", unit);
    }
    fields += stepper(id, "sets", e.sets, 1, "Sätze", "");
    fields += `</div><div class="fields">` + repsRow(id, "reps", e.reps, ex.mode === "drop" ? "Wdh. schwer" : "Wdh. pro Satz") + `</div>`;
    if (ex.mode === "drop") {
      fields += `<div class="fields sub">` + stepper(id, "w2", e.w2, 1, "Leicht", "kg") + repsRow(id, "reps2", e.reps2, "Wdh. bis Versagen") + `</div>`;
    }
  }
  const extra = ex.mode === "perSide" && ex.bar ? ` · Stange ${fmtN(ex.bar)} kg → ${fmtN(loadKg(ex, e))} kg gesamt` : ex.unit === "lb" && e.w ? ` · ≈ ${fmtN(e.w * LB)} kg` : "";
  let last = prev ? `Letztes Mal (${fmtDate(prev.date)}): ${esc(weightText(ex, prev.e))}${ex.mode === "none" ? "erledigt" : " · " + esc(repsText(ex, prev.e))}` : "Noch kein Eintrag – Werte aus deinem Plan";
  let pill = "";
  if (done && prev) {
    const a = score(ex, saved), b = score(ex, prev.e);
    if (a != null && b != null) {
      const bestBefore = best(id, state.date);
      if (bestBefore != null && a > bestBefore + 0.01 && ex.mode !== "none") pill = `<span class="pill pr">Neuer Bestwert</span>`;
      else if (a > b + 0.01) pill = `<span class="pill up">▲ besser als letztes Mal</span>`;
      else if (a < b - 0.01) pill = `<span class="pill down">▼ weniger als letztes Mal</span>`;
      else pill = `<span class="pill">= wie letztes Mal</span>`;
    }
  }
  return `<article class="card${done ? " done" : ""}" data-card="${id}">
    <div class="card-head"><div><h3>${esc(ex.name)}</h3><div class="meta">${esc(ex.where)} · Ziel ${esc(ex.range)}${extra}</div></div>
    <button class="check" data-toggle="${id}" aria-pressed="${done}" aria-label="${done ? "Eintrag entfernen" : "Als erledigt eintragen"}">✓</button></div>
    ${fields}
    <div class="last">${last}${pill}</div>
  </article>`;
}
function prefillFrom(id, p) {
  const e = structuredClone(p);
  delete e.done;
  return e;
}
function currentValues(id) {
  const ex = EX[id];
  const saved = draft.entries[id];
  if (saved) return saved;
  const prev = previous(id, state.date);
  return prev ? prefillFrom(id, prev.e) : defaultEntry(id);
}
function resize(arr, n, fill) { const a = arr.slice(0, n); while (a.length < n) a.push(a.length ? a[a.length - 1] : fill); return a; }

function commit(id, e, rerender = true) {
  draft.entries[id] = e;
  scheduleSave();
  if (rerender) rerenderCard(id);
}
function rerenderCard(id) {
  const old = $(`[data-card="${id}"]`);
  if (!old) return renderLog();
  const focusId = document.activeElement && document.activeElement.id;
  const tmp = document.createElement("div");
  tmp.innerHTML = card(id);
  old.replaceWith(tmp.firstElementChild);
  if (focusId && document.getElementById(focusId)) { const f = document.getElementById(focusId); f.focus(); }
  const day = DAY[state.day];
  const p = $(".progress");
  if (p) p.textContent = `${day.ex.filter(x => draft.entries[x]).length} von ${day.ex.length} Übungen eingetragen · ${wdName(state.date)}, ${fmtDate(state.date)}`;
}

$("#view-log").addEventListener("click", ev => {
  const b = ev.target.closest("button");
  if (!b) return;
  if (b.dataset.day) {
    flushNow();
    state.day = b.dataset.day; loadDraft(); renderLog(); return;
  }
  if (b.dataset.toggle) {
    const id = b.dataset.toggle;
    if (draft.entries[id]) { delete draft.entries[id]; scheduleSave(); rerenderCard(id); }
    else commit(id, structuredClone(currentValues(id)));
    return;
  }
  if (b.dataset.step) {
    const [id, field, d] = b.dataset.step.split("|");
    const ex = EX[id];
    const e = structuredClone(currentValues(id));
    const v = Math.max(field === "sets" ? 1 : 0, Math.round((num(e[field]) + num(d)) * 100) / 100);
    e[field] = field === "sets" ? Math.min(10, v) : v;
    if (field === "sets") {
      e.reps = resize(e.reps || [], e.sets, ex.reps);
      if (ex.mode === "drop") e.reps2 = resize(e.reps2 || [], e.sets, ex.reps2);
    }
    commit(id, e);
  }
});
$("#view-log").addEventListener("input", ev => {
  const t = ev.target;
  if (!t.dataset.ex) return;
  const id = t.dataset.ex, field = t.dataset.field, ex = EX[id];
  const e = structuredClone(currentValues(id));
  if (t.dataset.i != null) { e[field] = (e[field] || []).slice(); e[field][+t.dataset.i] = num(t.value); }
  else if (field === "sets") {
    e.sets = Math.max(1, Math.min(10, Math.round(num(t.value)) || 1));
    e.reps = resize(e.reps || [], e.sets, ex.reps);
    if (ex.mode === "drop") e.reps2 = resize(e.reps2 || [], e.sets, ex.reps2);
    commit(id, e); return;
  }
  else e[field] = num(t.value);
  const wasDone = !!draft.entries[id];
  commit(id, e, false);
  if (!wasDone) rerenderCard(id); else updateLastLine(id);
});
function updateLastLine(id) {
  clearTimeout(updateLastLine.t);
  updateLastLine.t = setTimeout(() => rerenderCard(id), 900);
}
$("#view-log").addEventListener("change", ev => {
  if (ev.target.id === "date" && ev.target.value) {
    flushNow();
    state.date = ev.target.value;
    state.day = (DAY[state.day] && !DAY[state.day].rest && state.sessions.some(s => s.id === sessionId(state.date, state.day))) ? state.day : dayOfDate(state.date).key;
    loadDraft(); renderLog();
  }
});
function flushNow() { if (dirty) { clearTimeout(saveTimer); flush(); } }

// ---------- Progress view ----------
function seriesFor(id) {
  const ex = EX[id];
  return state.sessions.filter(s => s.entries && s.entries[id]).map(s => {
    const e = s.entries[id];
    return { date: s.date, e, load: loadKg(ex, e), reps: totalReps(e), vol: volume(ex, e), e1: e1rm(ex, e) };
  }).sort((a, b) => a.date < b.date ? -1 : 1);
}
const METRICS = {
  load: { label: "Gewicht", unit: "kg", get: p => p.load },
  e1: { label: "Kraft (1RM geschätzt)", unit: "kg", get: p => p.e1 },
  vol: { label: "Volumen", unit: "kg", get: p => p.vol },
  reps: { label: "Wdh. gesamt", unit: "Wdh.", get: p => p.reps },
};
function renderProg() {
  const el = $("#view-prog");
  const ex = EX[state.progEx];
  const weightless = ex.mode === "stack" || ex.mode === "none";
  if (weightless) state.metric = "reps";
  const pts = seriesFor(state.progEx);
  const opts = Object.entries(EX).map(([id, x]) => `<option value="${id}"${id === state.progEx ? " selected" : ""}>${esc(x.name)}</option>`).join("");
  const metricKeys = weightless ? ["reps"] : ["load", "e1", "vol", "reps"];
  let html = `<div style="display:grid;gap:12px">
    <div class="field"><label class="lbl" for="progEx">Übung</label><select id="progEx">${opts}</select></div>
    <div class="seg" role="group" aria-label="Kennzahl">${metricKeys.map(k => `<button data-metric="${k}" aria-pressed="${k === state.metric}">${METRICS[k].label}</button>`).join("")}</div>`;
  if (!pts.length) {
    html += `<div class="chartbox"><p class="empty">Noch keine Einträge für ${esc(ex.name)}. Sobald du sie im Tab „Training“ abhakst, erscheint hier dein Verlauf.</p></div>`;
  } else {
    const first = pts[0], lastP = pts[pts.length - 1];
    const m = METRICS[state.metric];
    const bestV = Math.max(...pts.map(m.get).filter(v => v != null));
    const diff = m.get(lastP) - m.get(first);
    html += `<div class="stats">
      <div class="stat"><span class="lbl">Aktuell</span><b>${fmtN(m.get(lastP))}</b><span class="meta">${m.unit}</span></div>
      <div class="stat"><span class="lbl">Bestwert</span><b>${fmtN(bestV)}</b><span class="meta">${m.unit}</span></div>
      <div class="stat"><span class="lbl">Seit Start</span><b style="color:${diff > 0 ? "var(--good)" : diff < 0 ? "var(--bad)" : "inherit"}">${diff > 0 ? "+" : ""}${fmtN(diff)}</b><span class="meta">seit ${fmtDate(first.date)}</span></div>
    </div>
    <div class="chartbox" id="chart"></div>`;
    html += `<div class="tablewrap"><table><thead><tr><th>Datum</th><th>Gewicht</th><th>Wdh.</th><th>Volumen</th></tr></thead><tbody>` +
      pts.slice().reverse().map(p => `<tr><td>${wdName(p.date)} ${fmtDate(p.date)}</td><td>${esc(weightText(ex, p.e)) || "–"}</td><td>${esc(repsText(ex, p.e))}</td><td>${p.vol != null ? fmtN(p.vol) + " kg" : "–"}</td></tr>`).join("") +
      `</tbody></table></div>`;
  }
  html += `<p class="meta">„Kraft“ schätzt dein 1-Wiederholungs-Maximum aus Gewicht und bestem Satz (Epley). So zählt auch ein Fortschritt bei den Wiederholungen. Bei Scheiben pro Seite rechnet die App mit dem Gesamtgewicht inkl. Stange, Pfund werden in kg umgerechnet.</p></div>`;
  el.innerHTML = html;
  if (pts.length) drawChart($("#chart"), pts, METRICS[state.metric]);
}
function drawChart(box, pts, m) {
  const W = Math.max(280, box.clientWidth - 16), H = 220, L = 44, R = 14, T = 14, B = 30;
  const vals = pts.map(m.get);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi === lo) { hi += Math.max(1, hi * 0.05); lo -= Math.max(1, lo * 0.05); }
  const padv = (hi - lo) * 0.12; lo = Math.max(0, lo - padv); hi += padv;
  const t0 = new Date(pts[0].date + "T12:00").getTime(), t1 = new Date(pts[pts.length - 1].date + "T12:00").getTime();
  const x = d => pts.length === 1 ? (L + W - R) / 2 : L + (new Date(d + "T12:00").getTime() - t0) / (t1 - t0) * (W - L - R);
  const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const ticks = niceTicks(lo, hi, 4);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(m.label)} über die Zeit">`;
  for (const tv of ticks) s += `<line x1="${L}" x2="${W - R}" y1="${y(tv)}" y2="${y(tv)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(tv) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtN(tv)}</text>`;
  const xl = [pts[0], pts[pts.length - 1]];
  if (pts.length > 1) xl.forEach((p, i) => s += `<text x="${x(p.date)}" y="${H - 8}" text-anchor="${i ? "end" : "start"}" font-size="11" fill="var(--muted)">${fmtDate(p.date)}</text>`);
  else s += `<text x="${x(pts[0].date)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${fmtDate(pts[0].date)}</text>`;
  const path = pts.map((p, i) => `${i ? "L" : "M"}${x(p.date).toFixed(1)},${y(m.get(p)).toFixed(1)}`).join("");
  if (pts.length > 1) {
    s += `<path d="${path}L${x(pts[pts.length - 1].date)},${H - B}L${x(pts[0].date)},${H - B}Z" fill="var(--accent)" fill-opacity=".10"/>`;
    s += `<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  pts.forEach((p, i) => {
    const endP = i === pts.length - 1;
    s += `<circle cx="${x(p.date)}" cy="${y(m.get(p))}" r="${endP ? 5 : 3.5}" fill="${endP ? "var(--accent)" : "var(--surface)"}" stroke="var(--accent)" stroke-width="2"/>`;
  });
  const lp = pts[pts.length - 1];
  s += `<text x="${Math.min(x(lp.date), W - R)}" y="${y(m.get(lp)) - 10}" text-anchor="end" font-size="12" font-weight="600" fill="var(--ink)">${fmtN(m.get(lp))} ${m.unit}</text>`;
  s += `<rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" id="hit"/></svg><div class="tip" id="tip" hidden></div>`;
  box.innerHTML = s;
  const svg = box.querySelector("svg"), tip = box.querySelector("#tip");
  svg.addEventListener("pointermove", ev => {
    const r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) * W / r.width;
    let bi = 0; pts.forEach((p, i) => { if (Math.abs(x(p.date) - sx) < Math.abs(x(pts[bi].date) - sx)) bi = i; });
    const p = pts[bi];
    tip.hidden = false;
    tip.textContent = `${wdName(p.date)} ${fmtDate(p.date)} · ${fmtN(m.get(p))} ${m.unit}`;
    tip.style.left = (x(p.date) * r.width / W + 8) + "px";
    tip.style.top = (y(m.get(p)) * r.height / H + 12) + "px";
  });
  svg.addEventListener("pointerleave", () => tip.hidden = true);
}
function niceTicks(lo, hi, n) {
  const span = hi - lo, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(k => k * mag).find(k => span / k <= n) || 10 * mag;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(Math.round(v * 100) / 100);
  return out;
}
$("#view-prog").addEventListener("change", ev => {
  if (ev.target.id === "progEx") { state.progEx = ev.target.value; try { localStorage.setItem("gym.progEx", state.progEx); } catch (_) {} if (state.metric === "reps" && !["stack", "none"].includes(EX[state.progEx].mode)) state.metric = "load"; renderProg(); }
});
$("#view-prog").addEventListener("click", ev => { const b = ev.target.closest("[data-metric]"); if (b) { state.metric = b.dataset.metric; renderProg(); } });

// ---------- History view ----------
function renderHist() {
  const el = $("#view-hist");
  if (!state.sessions.length) { el.innerHTML = `<div class="rest-card"><h3>Noch keine Trainings</h3><p>Hake im Tab „Training“ deine erste Übung ab. Jeder Trainingstag landet dann hier.</p></div>`; return; }
  const weeks = {};
  el.innerHTML = `<div class="list">` + state.sessions.map(s => {
    const d = DAY[s.day] || { name: s.day, key: s.day };
    const items = Object.entries(s.entries || {}).filter(([id]) => EX[id]).map(([id, e]) => `<li>${esc(EX[id].name)}: ${esc(weightText(EX[id], e))}${EX[id].mode === "none" ? "erledigt" : " · " + esc(repsText(EX[id], e))}</li>`).join("");
    const conf = state.confirmDel === s.id
      ? `<div class="confirm">Training löschen? <button class="btn danger" data-del="${s.id}">Löschen</button><button class="btn" data-cancel>Abbrechen</button></div>`
      : `<button class="link" data-ask="${s.id}">Löschen</button>`;
    return `<div class="sess" style="--dc:var(--d-${d.key}, var(--muted))"><div class="row"><h3>${esc(d.name)}${d.tag ? " " + d.tag : ""}</h3><span class="meta">${wdName(s.date)}, ${fmtDate(s.date)}</span></div><ul>${items}</ul>
      <div class="row"><button class="btn" data-open="${s.id}">Bearbeiten</button>${conf}</div></div>`;
  }).join("") + `</div>`;
}
$("#view-hist").addEventListener("click", async ev => {
  const b = ev.target.closest("button"); if (!b) return;
  if (b.dataset.ask) { state.confirmDel = b.dataset.ask; renderHist(); }
  else if (b.hasAttribute("data-cancel")) { state.confirmDel = null; renderHist(); }
  else if (b.dataset.del) {
    state.confirmDel = null;
    try { await state.db.collection("sessions").doc(b.dataset.del).delete(); setStatus("Gelöscht"); }
    catch (_) { setStatus("Löschen fehlgeschlagen", true); }
  } else if (b.dataset.open) {
    const s = state.sessions.find(x => x.id === b.dataset.open);
    flushNow();
    state.date = s.date; state.day = s.day; loadDraft(); show("log");
  }
});

// ---------- Views ----------
function show(v) {
  state.view = v;
  try { localStorage.setItem("gym.view", v); } catch (_) {}
  for (const k of ["log", "prog", "hist"]) { $("#view-" + k).hidden = k !== v; $("#tab-" + k).setAttribute("aria-selected", k === v); }
  if (v === "log") renderLog(); else if (v === "prog") renderProg(); else renderHist();
}
document.querySelector(".tabs").addEventListener("click", ev => { const b = ev.target.closest("[data-view]"); if (b) { flushNow(); show(b.dataset.view); } });
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => state.view === "prog" && renderProg(), 150); });

loadDraft();
show(state.view);

// ---------- Storage ----------
(async () => {
  const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
  if (!db) {
    setStatus("Offline", true);
    const bn = $("#banner"); bn.hidden = false;
    bn.textContent = "Der Speicher ist in dieser Ansicht nicht erreichbar. Öffne die Seite über claude.ai und melde dich an, damit deine Einträge gespeichert werden.";
    return;
  }
  state.db = db;
  setStatus("Bereit");
  db.collection("sessions").orderBy("date", "desc").limit(1000).onSnapshot(snap => {
    state.sessions = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => a.date === b.date ? (a.updatedAt < b.updatedAt ? 1 : -1) : (a.date < b.date ? 1 : -1));
    // Keep the in-progress draft; adopt remote data only when nothing local is pending
    if (!dirty && !saving) loadDraft();
    const active = document.activeElement;
    const typing = active && active.dataset && active.dataset.ex;
    if (state.view === "log" && !typing) renderLog();
    else if (state.view === "prog") renderProg();
    else if (state.view === "hist") renderHist();
  }, err => { setStatus("Verbindung verloren – Seite neu laden", true); });
})();
</script>
