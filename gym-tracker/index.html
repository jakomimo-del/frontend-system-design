<title>Trainingsbuch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone = one column + bottom bar; iPad (≥760px) = left rail + multi-column panels.
   Palette: deliberately single dark look — black ground, matte-black panels, soft white as the only accent. */
:root {
  --bg: #0a0a0b;
  --panel: #141415;
  --panel-2: #161617;
  --raise: #1e1e20;
  --ink: #ededee;
  --muted: #8b8b90;
  --dim: #5c5c61;
  --line: #222224;
  --edge: #2e2e31;
  --blue: #e9e9ea;            /* accent: soft white */
  --blue-hi: #f4f4f5;
  --blue-soft: rgba(255, 255, 255, .07);
  --blue-ink: #0a0a0b;
  --good: #7fcf9f;
  --warn: #e3b366;
  --bad: #e5776b;
  --f-display: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --nav-h: 62px;
  --rail: 92px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; background: var(--bg); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.wrap { max-width: 1360px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.wrap > section, .view { display: grid; gap: 14px; min-width: 0; align-content: start; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
h1 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
h2 { font-size: 15px; font-weight: 600; color: var(--muted); }
h3 { font-size: 16px; font-weight: 600; letter-spacing: -.005em; }
.card > h3, .card > .row > h3, .card > .row > div > h3:only-child { font-size: 14px; font-weight: 600; color: var(--muted); }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 1.5px solid var(--blue-hi); outline-offset: 2px; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .01em; color: var(--muted); font-weight: 500; }
.meta { font-size: 13px; color: var(--muted); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.status { font-family: var(--f-mono); font-size: 11px; color: var(--muted); letter-spacing: .01em; display: inline-flex; align-items: center; gap: 7px; }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--good); }
.status.err { color: var(--bad); }
.status.err::before { background: var(--bad); }
.clock { font-size: 13px; font-weight: 600; color: var(--ink); }
.banner { border: 1px solid var(--bad); color: var(--bad); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.hint { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 11px 13px; font-size: 14px; color: var(--muted); }
.hint b { color: var(--ink); }

/* panels with corner brackets */
.card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 12px; min-width: 0; align-content: start; }
.card.done { border-color: var(--edge); background: var(--panel-2); }
.card-head { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; }
.card-head > div { min-width: 0; }
.list { display: grid; gap: 12px; }

/* split layouts: columns on iPad, a single ordered column on phone */
.split { display: grid; gap: 14px; }
.split > .col { display: contents; }
.o1 { order: 1; } .o2 { order: 2; } .o3 { order: 3; } .o4 { order: 4; } .o5 { order: 5; } .o6 { order: 6; } .o7 { order: 7; } .o8 { order: 8; }

/* navigation: bottom bar on phone, left rail on iPad */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(12, 12, 13, .92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.nav-in { max-width: 620px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
.nav button { border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 4px; font-family: var(--f-mono); font-size: 10px; font-weight: 500; color: var(--dim); letter-spacing: .01em; position: relative; }
.nav svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.nav button[aria-selected="true"] { color: var(--blue-hi); }
.nav button[aria-selected="true"]::before { content: ""; position: absolute; top: 0; left: 34%; right: 34%; height: 2px; border-radius: 2px; background: var(--ink); }
.nav .mark { display: none; }

/* controls */
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 3px; gap: 2px; max-width: 100%; justify-self: start; }
.seg button { border: 0; background: none; padding: 7px 12px; font-size: 12px; font-weight: 600; color: var(--muted); border-radius: 99px; letter-spacing: .01em; }
.seg button[aria-pressed="true"] { background: var(--blue-soft); color: var(--blue-hi); box-shadow: inset 0 0 0 1px var(--edge); }
.btn { border: 1px solid var(--line); background: var(--raise); border-radius: 10px; padding: 8px 13px; font-weight: 600; font-size: 13px; letter-spacing: .04em; }
.btn:hover { border-color: var(--edge); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); }
.btn.ghost { background: none; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { padding: 6px 10px; font-size: 12px; }
.link { border: 0; background: none; color: var(--bad); font-size: 12px; font-weight: 600; padding: 4px 0; letter-spacing: .01em; }
.link.blue { color: var(--blue-hi); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
input[type="date"], input[type="time"], input[type="text"], input.plain, textarea, select { font: inherit; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 8px 10px; max-width: 100%; }
input[type="date"], input[type="time"], input.plain[type="number"] { font-family: var(--f-mono); font-size: 14px; }
input:focus, textarea:focus, select:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px var(--blue-soft); }
textarea { width: 100%; resize: vertical; min-height: 80px; }
input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; }
.fields { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; }
.field { display: grid; gap: 5px; min-width: 0; }
.lbl { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .01em; color: var(--muted); font-weight: 500; }
.stepper { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); }
.stepper button { width: 42px; border: 0; background: var(--raise); font-size: 19px; font-weight: 500; color: var(--blue-hi); }
.stepper input { width: 64px; border: 0; text-align: center; font-family: var(--f-mono); font-size: 17px; font-weight: 600; background: var(--bg); color: var(--ink); padding: 8px 0; }
.reps { display: flex; gap: 6px; flex-wrap: wrap; }
.reps input { width: 48px; border: 1px solid var(--line); border-radius: 10px; text-align: center; font-family: var(--f-mono); font-size: 16px; font-weight: 600; padding: 8px 0; background: var(--bg); color: var(--ink); }
.unit { font-size: 12px; color: var(--muted); align-self: center; }
.check { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--edge); background: var(--bg); display: grid; place-items: center; color: var(--dim); flex: none; }
.check svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.card.done .check, .check[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); }
.pill { font-family: var(--f-mono); font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 99px; background: var(--raise); color: var(--muted); white-space: nowrap; letter-spacing: .02em; }
.pill.ok, .pill.up { background: color-mix(in srgb, var(--good) 13%, transparent); color: var(--good); }
.pill.mid { background: color-mix(in srgb, var(--warn) 13%, transparent); color: var(--warn); }
.pill.down { background: color-mix(in srgb, var(--bad) 13%, transparent); color: var(--bad); }
.pill.pr, .pill.blue { background: var(--blue-soft); color: var(--blue-hi); box-shadow: inset 0 0 0 1px var(--edge); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 11px; font-size: 13px; font-weight: 600; text-align: left; }
.chip small { font-family: var(--f-mono); color: var(--muted); font-weight: 400; font-size: 11px; margin-left: 6px; }
.chip.on { border-color: var(--blue); background: var(--blue-soft); color: var(--blue-hi); }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.scale button { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 0; font-family: var(--f-mono); font-size: 14px; font-weight: 600; color: var(--muted); }
.scale button[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); }

/* today */
.readouts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.goal { background: var(--raise); border-radius: 14px; padding: 12px 14px; display: grid; gap: 7px; min-width: 0; align-content: start; }
.goal .bar { background: var(--edge); }
.goal .row { gap: 4px; }
.goal b { white-space: nowrap; font-family: var(--f-mono); font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.goal b .meta { font-size: 12px; font-weight: 400; letter-spacing: 0; }
.goal .meta { font-size: 11.5px; }
.bar { position: relative; height: 3px; background: var(--raise); border-radius: 2px; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--blue); border-radius: 2px; }
.bar i.full { background: var(--blue-hi); }
.bar i.over { background: var(--warn); }
.taskgroup { display: grid; gap: 0; }
.taskgroup + .taskgroup { margin-top: 6px; }
.task { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.task:last-child { border-bottom: 0; }
.task > div { min-width: 0; }
.task .name { font-weight: 600; }
.task > .meta { font-family: var(--f-mono); font-size: 11px; }
.task.done .name { color: var(--muted); }
.tag { font-family: var(--f-mono); font-size: 10.5px; font-weight: 600; letter-spacing: .01em; padding: 2px 5px; border-radius: 99px; background: var(--raise); color: var(--muted); vertical-align: 1px; margin-left: 6px; }
.big { font-family: var(--f-mono); font-size: 30px; font-weight: 600; line-height: 1; letter-spacing: -.02em; }
.big small { font-size: 13px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.sysline { font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: .01em; }
.sysline b { color: var(--ink); font-weight: 500; }

/* training */
.days { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 6px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.day { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 7px 2px; display: grid; justify-items: center; gap: 2px; }
.day b { font-family: var(--f-mono); font-size: 14px; font-weight: 600; line-height: 1; }
.day small { font-size: 10px; color: var(--muted); white-space: nowrap; }
.day[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); color: var(--blue-hi); }
.day.rest { opacity: .45; }
.last { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sub { border-top: 1px dashed var(--line); padding-top: 10px; }
.rest-card { background: var(--panel); border: 1px dashed var(--edge); border-radius: 18px; padding: 24px 16px; text-align: center; color: var(--muted); display: grid; gap: 6px; }
.sess { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; gap: 6px; }
.sess ul { margin: 0; padding-left: 18px; font-size: 14px; color: var(--muted); }

/* charts & tables */
.chartbox { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 12px 8px 4px; min-width: 0; }
.chartbox svg { display: block; width: 100%; height: auto; }
.chartbox svg text { font-family: var(--f-mono); }
.chartbox .ctitle { font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: .01em; color: var(--blue-hi); padding: 0 6px 6px; }
.tip { position: absolute; pointer-events: none; background: var(--raise); border: 1px solid var(--edge); color: var(--ink); font-family: var(--f-mono); font-size: 11px; padding: 6px 8px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -115%); z-index: 2; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats.four { grid-template-columns: repeat(2, 1fr); }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 11px; display: grid; gap: 3px; min-width: 0; }
.stat b { font-family: var(--f-mono); font-size: 19px; font-weight: 600; line-height: 1.15; letter-spacing: -.01em; }
.tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 9px 11px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { font-family: var(--f-mono); font-size: 12.5px; }
th { font-family: var(--f-mono); font-size: 10px; letter-spacing: .01em; color: var(--muted); font-weight: 500; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
.empty { color: var(--muted); padding: 20px 12px; text-align: center; font-size: 13px; }
.trends { display: grid; grid-template-columns: 1fr; gap: 10px; }

/* nutrition */
.meter { display: grid; gap: 6px; }
.meter .track { position: relative; height: 4px; background: var(--raise); border-radius: 2px; overflow: visible; }
.meter .fill { position: absolute; inset: 0 auto 0 0; background: var(--blue); border-radius: 2px; }
.meter .fill.over { background: var(--warn); }
.meter .tick { position: absolute; top: -4px; bottom: -4px; width: 1.5px; background: var(--ink); opacity: .7; }
.meter .row { font-size: 13px; }
.meter .row > span:last-child { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.meal { display: grid; gap: 8px; }
.meal + .meal { border-top: 1px solid var(--line); padding-top: 12px; }
.items { display: grid; gap: 4px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) repeat(4, 50px) 26px; gap: 4px; align-items: center; font-size: 14px; }
.item input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 6px 5px; font-family: var(--f-mono); font-size: 12.5px; background: var(--bg); color: var(--ink); text-align: right; }
.item input.name { text-align: left; font-family: var(--f-body); font-size: 13.5px; }
.item.head { font-family: var(--f-mono); font-size: 10px; letter-spacing: .01em; color: var(--muted); }
.item.head span:not(:first-child) { text-align: right; }
.x { border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; padding: 4px; }
.review { white-space: pre-wrap; font-size: 14px; line-height: 1.6; }
.thinking { color: var(--muted); font-style: italic; }
.datenav { display: flex; align-items: center; gap: 6px; }
.datenav .btn { padding: 7px 11px; }

/* sleep */
.dur { font-family: var(--f-mono); font-size: 26px; font-weight: 600; color: var(--blue-hi); }

/* stack */
.stackitem { display: grid; gap: 10px; }
.cycle { display: grid; gap: 6px; }
.edit { border-top: 1px dashed var(--line); padding-top: 12px; display: grid; gap: 10px; }
.calc { background: var(--bg); border: 1px solid var(--edge); border-radius: 8px; padding: 9px 11px; font-size: 13.5px; }
.calc b { color: var(--blue-hi); font-family: var(--f-mono); }

/* ---------- iPad and wider ---------- */
@media (min-width: 640px) {
  .readouts { grid-template-columns: repeat(3, 1fr); }
  .stats.four { grid-template-columns: repeat(4, 1fr); }
  .trends { grid-template-columns: 1fr 1fr; }
}
@media (min-width: 760px) {
  .wrap { padding-left: calc(var(--rail) + 28px + env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); padding-block: 26px 48px; gap: 18px; }
  .nav { top: 0; bottom: 0; right: auto; width: calc(var(--rail) + env(safe-area-inset-left, 0px)); border-top: 0; border-right: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
  .nav-in { height: 100%; grid-template-columns: 1fr; grid-auto-rows: 74px; align-content: start; padding-top: 18px; }
  .nav .mark { display: grid; place-items: center; height: 60px; margin-bottom: 14px; }
  .nav .mark span { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--ink); }
  .nav button[aria-selected="true"]::before { top: 22%; bottom: 22%; left: 0; right: auto; width: 2px; height: auto; }
  .split { grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); align-items: start; }
  .split > .col { display: grid; gap: 14px; align-content: start; min-width: 0; }
  .split.three { --cols: 3; }
  .split.wide-left { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
  .split .stats.four { grid-template-columns: repeat(2, 1fr); }
  .trends { grid-template-columns: repeat(4, 1fr); }
  #view-log .list, #view-hist .list { grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); align-items: start; }
  #view-prog { max-width: 980px; }
  .days { top: 0; }
}
@media (min-width: 760px) and (max-width: 1099px) {
  .split.three { --cols: 2; }
  .split.three > .col:nth-child(3) { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; }
}
@media (min-width: 1100px) { .readouts { grid-template-columns: repeat(6, 1fr); } }
@media (prefers-reduced-motion: no-preference) { .card, .check, .fill, .bar i { transition: border-color .15s, background .15s, width .3s; } }
</style>

<div class="wrap">
  <header class="row">
    <div><span class="eyebrow" id="today-label"></span><h1 id="page-title">Heute</h1></div>
    <div style="display:grid;justify-items:end;gap:5px"><span class="clock" id="clock"></span><span class="status" id="status">Verbinde …</span></div>
  </header>
  <div id="banner" class="banner" hidden></div>

  <section id="sec-heute"></section>

  <section id="sec-training" hidden>
    <div class="seg" role="group" aria-label="Training-Ansicht">
      <button data-view="log" aria-pressed="true">Eintragen</button>
      <button data-view="prog" aria-pressed="false">Fortschritt</button>
      <button data-view="hist" aria-pressed="false">Verlauf</button>
    </div>
    <div id="view-log" class="view"></div>
    <div id="view-prog" class="view" hidden></div>
    <div id="view-hist" class="view" hidden></div>
  </section>

  <section id="sec-essen" hidden>
    <div class="seg" role="group" aria-label="Ernährung-Ansicht">
      <button data-nview="day" aria-pressed="true">Tag</button>
      <button data-nview="stats" aria-pressed="false">Statistik</button>
      <button data-nview="goal" aria-pressed="false">Ziel &amp; Profil</button>
    </div>
    <div id="nview-day" class="view"></div>
    <div id="nview-stats" class="view" hidden></div>
    <div id="nview-goal" class="view" hidden></div>
  </section>

  <section id="sec-schlaf" hidden></section>
  <section id="sec-stack" hidden></section>
</div>

<nav class="nav" role="tablist" aria-label="Bereich"><div class="nav-in">
  <div class="mark" aria-hidden="true"><span></span></div>

async function calcMeal() {
  const text = ($("#mealText").value || "").trim();
  if (!text) { $("#mealMsg").textContent = "Schreib zuerst, was du gegessen hast."; return; }
  state.mealDraft = text; state.busyMeal = true; renderNDay();
  const prompt = `Du bist Ernährungsberater. Schätze die Nährwerte dieser Mahlzeit so genau wie möglich. Nutze deutsche Standard-Nährwerttabellen. Wenn keine Menge genannt ist, nimm eine typische Portion für einen trainierenden jungen Mann an und schreib sie in "amount". Wenn ein Lebensmittel Koffein enthält, gib die Menge in mg als "caf" an.
Antworte NUR mit JSON in genau diesem Format:
{"items":[{"name":"Hähnchenbrust, gebraten","amount":"200 g","kcal":330,"p":62,"c":0,"f":7,"caf":0}]}
p = Eiweiß in g, c = Kohlenhydrate in g, f = Fett in g. Ganze Zahlen. Ein Eintrag pro Lebensmittel, deutsche Namen.

Mahlzeit: ${text.slice(0, 2000)}`;
  try {
    const res = await state.sample.json(prompt, { modelTier: "default" });
    const its = (res && Array.isArray(res.items) ? res.items : []).map(it => {
      const o = { name: String(it.name || "Lebensmittel").slice(0, 80), amount: String(it.amount || "").slice(0, 30), kcal: Math.round(num(it.kcal)), p: Math.round(num(it.p)), c: Math.round(num(it.c)), f: Math.round(num(it.f)) };
      if (num(it.caf)) o.caf = Math.round(num(it.caf));
      return o;
    }).slice(0, 30);
    if (!its.length) throw { code: "invalid_json" };
    nday(state.ndate).meals.push({ id: uid(), slot: state.slot || defaultSlot(), time: state.ndate === today() ? nowTime() : "", text, items: its });
    state.mealDraft = "";
    saveNutrition(state.ndate);
  } catch (e) {
    state.busyMeal = false; renderNDay();
    $("#mealMsg").textContent = sampleError(e.code);
    return;
  }
  state.busyMeal = false; renderNDay();
}
function sampleError(code) {
  return ({
    not_granted: "Claude wurde für diese Seite nicht erlaubt. Du kannst die Werte manuell eintragen.",
    rate_limited: "Gerade zu viele Anfragen. Versuch es in einer Minute nochmal.",
    invalid_json: "Das hat nicht geklappt. Formulier die Mahlzeit etwas genauer und versuch es nochmal.",
    refused: "Claude konnte das nicht berechnen. Trag die Werte manuell ein.",
  })[code] || "Berechnen ist fehlgeschlagen. Versuch es nochmal oder trag die Werte manuell ein.";
}
async function reviewDay() {

  state.busyReview = true; state.reviewStream = ""; renderNDay();

  const sl = state.sleep[date], dl = state.days[date];
  const prompt = `Du bist ein Ernährungscoach für Kraftsportler. Bewerte diesen Ernährungstag auf Deutsch, locker und direkt (du-Form), in 3–5 kurzen Sätzen ohne Überschriften und ohne Aufzählungszeichen. Sag, ob der Tag zum Ziel passt, was gut war und gib 1–2 konkrete Tipps für morgen (z. B. konkrete Lebensmittel).

Person: ${p.sex === "w" ? "Frau" : "Mann"}, ${p.age} Jahre, ${p.height} cm, ${fmtN(tg.weight)} kg. Ziel: ${tg.goal.label} (${tg.goal.text}).
Tagesziel: ${tg.kcal} kcal, ${tg.protein} g Eiweiß, ${tg.carbs} g Kohlenhydrate, ${tg.fat} g Fett.
${trained ? `Heute Training: ${DAY[trained.day] ? DAY[trained.day].name : "ja"}.` : "Heute kein Training."}${sl && sl.mins ? ` Schlaf letzte Nacht: ${durText(sl.mins)}.` : ""}${dl && num(dl.water) ? ` Wasser: ${fmtN(num(dl.water) / 1000)} l.` : ""}
Gegessen (Summe ${Math.round(t.kcal)} kcal, ${Math.round(t.p)} g Eiweiß, ${Math.round(t.c)} g KH, ${Math.round(t.f)} g Fett):
${d.meals.map(m => `- ${m.slot}${m.time ? " (" + m.time + ")" : ""}: ${(m.items || []).map(i => `${i.name}${i.amount ? " " + i.amount : ""} (${Math.round(num(i.kcal))} kcal)`).join(", ")}`).join("\n")}`;
  try {
    const { text } = await state.sample(prompt, { modelTier: "default", onText: ({ text }) => { state.reviewStream = text; const el = $("#reviewText"); if (el) el.textContent = text; } });

    const el = $("#reviewText"); if (el && e.code !== "cancelled") el.textContent = sampleError(e.code);

  }
  state.busyReview = false; renderNDay();
}

function renderNStats() {

  let html = `<div class="seg" role="group" aria-label="Zeitraum">${[7, 14, 30, 90].map(n => `<button data-nr="${n}" aria-pressed="${n === state.nrange}">${n} Tage</button>`).join("")}</div>`;
  if (!logged.length) { $("#nview-stats").innerHTML = html + `<div class="rest-card"><h3>Noch keine Daten</h3><p>Trag unter „Tag“ deine Mahlzeiten ein. Hier siehst du dann Durchschnitt, Trend und wie oft du im Ziel warst.</p></div>`; return; }
  const aK = avg(logged.map(r => r.t.kcal)), aP = avg(logged.map(r => r.t.p));

  const bws = days.filter(d => weightOn(d));

  html += `<div class="stats four">
    <div class="stat"><span class="lbl">Ø Kalorien</span><b>${fmtInt(aK)}</b><span class="meta">${tgToday ? `Ziel ${fmtInt(tgToday.kcal)}` : "kcal/Tag"}</span></div>

    <div class="stat"><span class="lbl">Gewicht</span><b>${bwDiff == null ? (bws.length ? fmtN(weightOn(bws[0])) : "–") : (bwDiff > 0 ? "+" : "") + fmtN(bwDiff)}</b><span class="meta">${bwDiff == null ? "kg" : "kg im Zeitraum"}</span></div>
  </div><div class="chartbox" id="nchart"></div><div class="chartbox" id="pchart"></div>`;
  if (tgToday && bwDiff != null && bws.length > 2) {
    const weeks = Math.max(1, daysBetween(bws[0], bws[bws.length - 1]) / 7);
    const perWeek = bwDiff / weeks, g = state.profile.goal;
    const msg = g === "bulk" ? (perWeek < 0.1 ? "Dein Gewicht steigt kaum. Für Aufbau ruhig 150–200 kcal mehr pro Tag essen." : perWeek > 0.5 ? "Du nimmst recht schnell zu. Etwas weniger Überschuss hält den Fettanteil im Rahmen." : "Gutes Tempo für sauberen Aufbau (0,1–0,5 kg pro Woche).")
      : g === "cut" ? (perWeek > -0.2 ? "Das Gewicht sinkt kaum. Prüf die Portionsgrößen oder geh 150–200 kcal runter." : perWeek < -1 ? "Du verlierst sehr schnell. Etwas mehr essen schützt deine Muskeln." : "Gutes Diät-Tempo (0,2–1 kg pro Woche).")
      : (Math.abs(perWeek) < 0.2 ? "Dein Gewicht ist stabil." : "Dein Gewicht verändert sich, obwohl du halten willst. Kalorien leicht anpassen.");
    html += `<div class="hint"><b>${perWeek > 0 ? "+" : ""}${fmtN(perWeek)} kg pro Woche.</b> ${esc(msg)}</div>`;
  }
  html += `<div class="tablewrap"><table><thead><tr><th>Tag</th><th class="num">kcal</th><th class="num">Eiweiß</th><th class="num">KH</th><th class="num">Fett</th><th>Bewertung</th></tr></thead><tbody>` +
    rows.slice().reverse().filter(r => r.t.kcal > 0).map(r => { const x = rateDay(r.t, r.tg); return `<tr><td>${wdName(r.d)} ${fmtDate(r.d)}</td><td class="num">${fmtInt(r.t.kcal)}</td><td class="num">${fmtInt(r.t.p)} g</td><td class="num">${fmtInt(r.t.c)} g</td><td class="num">${fmtInt(r.t.f)} g</td><td>${x ? `<span class="pill ${x.cls}">${esc(x.text)}</span>` : "–"}</td></tr>`; }).join("") +
    `</tbody></table></div>`;
  $("#nview-stats").innerHTML = html;
  drawChart($("#nchart"), rows.map(r => ({ x: r.d, v: r.t.kcal || null })), { kind: "bar", unit: "kcal", fmt: fmtInt, title: "Kalorien pro Tag", target: tgToday && tgToday.kcal, targetLabel: tgToday ? `Ziel ${fmtInt(tgToday.kcal)}` : "" });
  drawChart($("#pchart"), rows.map(r => ({ x: r.d, v: r.t.p || null })), { kind: "bar", unit: "g", fmt: fmtInt, title: "Eiweiß pro Tag", height: 170, target: tgToday && tgToday.protein, targetLabel: tgToday ? `Ziel ${tgToday.protein} g` : "" });
}

  drawChart($("#tr-steps"), r.map(x => ({ x, v: stepsOf(state.days[x]) || null })), { kind: "bar", unit: "Schritte", fmt: v => v >= 1000 ? fmtN(v / 1000) + "k" : fmtInt(v), title: "Schritte", height: 150, ticks: 3, target: stepsTarget(), targetLabel: fmtInt(stepsTarget()) });
  drawChart($("#tr-water"), r.map(x => ({ x, v: state.days[x] && num(state.days[x].water) ? num(state.days[x].water) / 1000 : null })), { kind: "bar", unit: "l", title: "Wasser", height: 150, ticks: 3, target: waterTarget() / 1000, targetLabel: `${fmtN(waterTarget() / 1000)} l` });
  drawChart($("#tr-weight"), r.map(x => ({ x, v: weightOn(x) })), { unit: "kg", title: "Morgengewicht", height: 150, ticks: 3, noArea: true });
  drawChart($("#tr-energy"), r.map(x => ({ x, v: state.days[x] && state.days[x].energy ? state.days[x].energy : null, label: state.days[x] ? `Energie ${state.days[x].energy || "–"} · Stimmung ${state.days[x].mood || "–"}` : "" })), { unit: "/ 5", title: "Energie", height: 150, ticks: 3, zero: true, max: 5, noArea: true });
}
$("#sec-heute").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  const date = state.hdate;
  if (b.dataset.hd) { flushAll(); state.hdate = addDays(date, +b.dataset.hd); renderHeute(); }
  else if (b.dataset.go) showSec(b.dataset.go);
  else if (b.dataset.take) { toggleTaken(date, b.dataset.take); renderHeute(); }
  else if (b.dataset.fav) { const f = state.favs.items.find(x => x.id === b.dataset.fav); addFav(date, f); renderHeute(); }
  else if (b.dataset.water) { const d = dlog(date); d.water = Math.max(0, num(d.water) + +b.dataset.water); saveDay(date); renderHeute(); }
  else if (b.dataset.walk) { const d = dlog(date); d.walkMin = Math.max(0, num(d.walkMin) + +b.dataset.walk); saveDay(date); renderHeute(); }
  else if (b.id === "h-cadd") { const min = num($("#h-cmin").value); if (!min) return; const d = dlog(date); d.cardio = [...(d.cardio || []), { id: uid(), type: $("#h-ctype").value, min }]; saveDay(date); renderHeute(); }
  else if (b.dataset.delcardio) { const d = dlog(date); d.cardio = (d.cardio || []).filter(c => c.id !== b.dataset.delcardio); saveDay(date); renderHeute(); }
  else if (b.dataset.caf) { const [mg, label] = b.dataset.caf.split("|"); const d = dlog(date); d.caffeine = [...(d.caffeine || []), { mg: +mg, label, time: date === today() ? nowTime() : "" }]; saveDay(date); renderHeute(); }
  else if (b.hasAttribute("data-cafundo")) { const d = dlog(date); d.caffeine = (d.caffeine || []).slice(0, -1); saveDay(date); renderHeute(); }
  else if (b.dataset.mood) { const d = dlog(date); d.mood = d.mood === +b.dataset.mood ? null : +b.dataset.mood; saveDay(date); renderHeute(); }
  else if (b.dataset.energy) { const d = dlog(date); d.energy = d.energy === +b.dataset.energy ? null : +b.dataset.energy; saveDay(date); renderHeute(); }
});
$("#sec-heute").addEventListener("input", ev => {
  const t = ev.target; if (!t.dataset.d) return;
  const d = dlog(state.hdate); d[t.dataset.d] = num(t.value) || null; saveDay(state.hdate);
});
$("#sec-heute").addEventListener("change", ev => {
  if (ev.target.id === "hdate" && ev.target.value) { flushAll(); state.hdate = ev.target.value; renderHeute(); }
});
renderOnLeave($("#sec-heute"), "[data-d]", () => renderHeute());

// =====================================================================
// STACK view
// =====================================================================
function adherence(it, n) {
  // count only days since tracking began, so a fresh stack doesn't start at 0 %
  const start = Object.keys(state.days).filter(d => Object.keys(state.days[d].stack || {}).length).sort()[0] || today();
  const r = dateRange(today(), n).filter(d => d >= start && (!it.cycleStart || d >= it.cycleStart));
  if (it.freq === "asneeded") return { taken: r.filter(d => takenOn(d, it.id)).length, due: null };
  if (it.freq === "weekly") { const weeks = [...new Set(r.map(weekStart))]; return { taken: weeks.filter(w => [0, 1, 2, 3, 4, 5, 6].some(i => takenOn(addDays(w, i), it.id))).length, due: weeks.length, unit: "Wochen" }; }
  const due = r.filter(d => dueOn({ ...it, active: true }, d));
  return { taken: due.filter(d => takenOn(d, it.id)).length, due: due.length, unit: "Tage" };
}
function itemCard(it) {
  const c = cycleInfo(it, today()), u = drawUnits(it), a = adherence(it, state.stackRange);
  const editing = state.editItem === it.id;
  const sched = it.freq === "weekly" ? `1× pro Woche, ab ${WD_LONG[it.weekday ?? 1]}` : it.freq === "days" ? `${(it.days || []).map(i => WD_LONG[i].slice(0, 2)).join(", ")}` : FREQ[it.freq];
  let html = `<div class="card stackitem"><div class="card-head"><div><h3>${esc(it.name)}${it.kind === "pep" ? `<span class="tag">Peptid</span>` : ""}${!it.active ? ` <span class="pill">pausiert</span>` : ""}</h3>
    <span class="meta">${esc(doseText(it))} · ${esc(sched)}${it.freq !== "asneeded" ? " · " + TIMES[it.time] : ""}</span>${it.note ? `<br><span class="meta">${esc(it.note)}</span>` : ""}</div>
    <button class="btn sm" data-edit="${it.id}">${editing ? "Fertig" : "Ändern"}</button></div>`;
  if (c) {
    const pct = c.before ? 0 : Math.min(100, c.day / c.total * 100);
    html += `<div class="cycle"><div class="row"><span class="meta">${c.before ? `Zyklus startet ${fmtDate(it.cycleStart)}` : c.over ? `Zyklus beendet am ${fmtDate(c.end)}` : `Zyklus: Woche ${c.week} von ${c.weeks} · Tag ${c.day}/${c.total}`}</span><span class="meta">bis ${fmtDate(c.end)}</span></div><div class="bar"><i class="${c.over ? "full" : ""}" style="width:${pct}%"></i></div></div>`;
  }
  if (u && !editing) html += `<div class="calc">${calcText(it)}</div>`;
  if (a.due != null) html += `<div class="row"><span class="meta">${a.due ? `Letzte ${state.stackRange} Tage: ${a.taken} von ${a.due} ${a.unit}` : "Quote startet mit deinem ersten Häkchen"}</span>${a.due ? `<span class="pill ${a.taken / a.due >= .85 ? "ok" : a.taken / a.due >= .5 ? "mid" : "down"}">${Math.round(a.taken / a.due * 100)} %</span>` : ""}</div>`;
  else html += `<span class="meta">Letzte ${state.stackRange} Tage: ${a.taken}× genommen</span>`;
  if (editing) html += editForm(it);
  return html + `</div>`;
}
function calcText(it) {
  const u = drawUnits(it);
  if (!u) return it.unit === "mcg" || it.unit === "mg" ? "Trag Ampullen-Inhalt und Wassermenge ein, dann siehst du hier, wie viele Einheiten du aufziehst." : "Der Rechner braucht die Dosis in mg oder mcg.";
  return `${fmtN(num(it.vialMg))} mg + ${fmtN(num(it.waterMl))} ml Wasser → <b>${fmtN(u.units)} Einheiten</b> (${fmtN(u.ml)} ml) pro Dosis auf einer U-100-Spritze · reicht für ${u.doses} Dosen`;
}
function editForm(it) {
  const f = (k, label, type = "text", w = 120) => `<div class="field"><label class="lbl" for="e-${k}">${label}</label><input class="plain" id="e-${k}" data-e="${k}" type="${type}" ${type === "number" ? 'inputmode="decimal" step="any"' : ""} style="width:${w}px" value="${esc(it[k] ?? "")}"></div>`;
  return `<div class="edit">
    <div class="fields">${f("name", "Name", "text", 180)}${f("dose", "Dosis", "number", 80)}
      <div class="field"><label class="lbl" for="e-unit">Einheit</label><select id="e-unit" data-e="unit">${["mg", "mcg", "g", "IE", "Tropfen", "Kapseln", "Löffel", "ml"].map(u => `<option${it.unit === u ? " selected" : ""}>${u}</option>`).join("")}</select></div></div>
    <div class="fields"><div class="field"><span class="lbl">Art</span><div class="seg"><button data-ekind="supp" aria-pressed="${it.kind !== "pep"}">Supplement</button><button data-ekind="pep" aria-pressed="${it.kind === "pep"}">Peptid</button></div></div>
      ${it.freq !== "asneeded" ? `<div class="field"><label class="lbl" for="e-time">Wann</label><select id="e-time" data-e="time">${Object.entries(TIMES).filter(([k]) => k !== "bedarf").map(([k, l]) => `<option value="${k}"${it.time === k ? " selected" : ""}>${l}</option>`).join("")}</select></div>` : ""}</div>
    <div class="field"><span class="lbl">Wie oft</span><div class="seg">${Object.entries(FREQ).map(([k, l]) => `<button data-efreq="${k}" aria-pressed="${it.freq === k}">${l}</button>`).join("")}</div></div>
    ${it.freq === "weekly" ? `<div class="field"><label class="lbl" for="e-weekday">Erinnern ab</label><select id="e-weekday" data-e="weekday">${[1, 2, 3, 4, 5, 6, 0].map(i => `<option value="${i}"${(it.weekday ?? 1) === i ? " selected" : ""}>${WD_LONG[i]}</option>`).join("")}</select></div>` : ""}
    ${it.freq === "days" ? `<div class="field"><span class="lbl">Tage</span><div class="chips">${[1, 2, 3, 4, 5, 6, 0].map(i => `<button class="chip${(it.days || []).includes(i) ? " on" : ""}" data-eday="${i}">${WD_LONG[i].slice(0, 2)}</button>`).join("")}</div></div>` : ""}
    <div class="fields">${f("cycleStart", "Zyklus-Start", "date", 160)}${f("cycleWeeks", "Wochen", "number", 80)}</div>
    ${it.kind === "pep" ? `<div class="fields">${f("vialMg", "Ampulle (mg)", "number", 100)}${f("waterMl", "Wasser (ml)", "number", 100)}</div><div class="calc" id="e-calc">${calcText(it)}</div>` : ""}
    ${f("note", "Notiz", "text", 260)}
    <div class="row"><button class="btn sm" data-eactive>${it.active ? "Pausieren" : "Aktivieren"}</button>
    ${state.confirmDel === "i:" + it.id ? `<div class="confirm">Wirklich löschen? <button class="btn danger sm" data-edel="${it.id}">Löschen</button><button class="btn sm" data-cancel>Nein</button></div>` : `<button class="link" data-eask="${it.id}">Löschen</button>`}</div>
  </div>`;
}
function renderStack() {
  const its = items();
  const sup = its.filter(i => i.kind !== "pep"), pep = its.filter(i => i.kind === "pep");
  const has = id => its.some(i => i.name.toLowerCase().includes(id));
  let html = `<div class="row"><div class="seg" role="group" aria-label="Zeitraum">${[7, 14, 30].map(n => `<button data-str="${n}" aria-pressed="${n === state.stackRange}">${n} Tage</button>`).join("")}</div><button class="btn primary sm" id="st-add">+ Neu</button></div>`;
  if (!its.length) html += `<div class="rest-card"><h3>Dein Stack ist leer</h3><p>Lege Supplements und Peptide mit „+ Neu“ an. Sie erscheinen dann jeden Tag unter „Heute“ zum Abhaken.</p></div>`;
  if (its.length) html += `<div class="split"><div class="col"><h2>Peptide</h2>${pep.map(itemCard).join("") || `<p class="meta">Keine Peptide angelegt.</p>`}</div><div class="col"><h2>Supplements</h2>${sup.map(itemCard).join("")}</div></div>`;
  const recs = [];
  if (!has("kreatin") && !has("creatin")) recs.push(`<div class="row"><div style="flex:1;min-width:200px"><b>Kreatin-Monohydrat · 5 g täglich</b><br><span class="meta">Das am besten belegte Supplement für Kraft und Muskelaufbau. Zeitpunkt egal, Hauptsache jeden Tag.</span></div><button class="btn sm" data-rec="kreatin">Hinzufügen</button></div>`);
  if (has("vitamin d") && !has("k2")) recs.push(`<div class="row"><div style="flex:1;min-width:200px"><b>Vitamin K2 (MK-7)</b><br><span class="meta">Wird oft zusammen mit hoch dosiertem Vitamin D genommen, am besten mit fetthaltigem Essen.</span></div><button class="btn sm" data-rec="k2">Hinzufügen</button></div>`);
  recs.push(`<div><b>Blutwerte 1–2× im Jahr</b><br><span class="meta">Vitamin D (25-OH), Ferritin, Zink, Magnesium, Blutbild, Leber- und Nierenwerte, Blutfette. So siehst du, ob deine Dosierungen passen, gerade bei Vitamin D und wenn du Peptide nimmst.</span></div>`);
  html += `<h2>Empfehlungen</h2><div class="card">${recs.join(`<div style="border-top:1px solid var(--line)"></div>`)}</div>`;
  $("#sec-stack").innerHTML = html;
}
const RECS = {
  kreatin: { name: "Kreatin", kind: "supp", dose: 5, unit: "g", time: "morgens", freq: "daily", note: "Monohydrat, passt z. B. in den Protein-Kaffee" },
  k2: { name: "Vitamin K2 (MK-7)", kind: "supp", dose: 200, unit: "mcg", time: "abends", freq: "weekly", weekday: 1, note: "Zusammen mit Vitamin D" },
};
function updateItem(id, patch) { const it = items().find(x => x.id === id); if (!it) return; Object.assign(it, patch); saveStack(); }
$("#sec-stack").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  const id = state.editItem, cur = items().find(x => x.id === id);
  if (b.dataset.str) { state.stackRange = +b.dataset.str; renderStack(); }
  else if (b.id === "st-add") { if (!state.stack) state.stack = { items: [] }; const it = { id: uid(), name: "Neues Supplement", kind: "supp", dose: 1, unit: "mg", time: "morgens", freq: "daily", active: true }; state.stack.items.unshift(it); state.editItem = it.id; saveStack(); renderStack(); }
  else if (b.dataset.rec) { if (!state.stack) state.stack = { items: [] }; state.stack.items.push({ id: uid(), active: true, ...RECS[b.dataset.rec] }); saveStack(); renderStack(); }
  else if (b.dataset.edit) { flushAll(); state.editItem = state.editItem === b.dataset.edit ? null : b.dataset.edit; state.confirmDel = null; renderStack(); }
  else if (b.dataset.ekind) { updateItem(id, { kind: b.dataset.ekind }); renderStack(); }
  else if (b.dataset.efreq) { const f = b.dataset.efreq; updateItem(id, { freq: f, time: f === "asneeded" ? "bedarf" : cur.time === "bedarf" ? "morgens" : cur.time }); renderStack(); }
  else if (b.dataset.eday) { const d = +b.dataset.eday, days = new Set(cur.days || []); days.has(d) ? days.delete(d) : days.add(d); updateItem(id, { days: [...days] }); renderStack(); }
  else if (b.hasAttribute("data-eactive")) { updateItem(id, { active: !cur.active }); renderStack(); }
  else if (b.dataset.eask) { state.confirmDel = "i:" + b.dataset.eask; renderStack(); }
  else if (b.hasAttribute("data-cancel")) { state.confirmDel = null; renderStack(); }
  else if (b.dataset.edel) { state.stack.items = items().filter(x => x.id !== b.dataset.edel); state.confirmDel = null; state.editItem = null; saveStack(); renderStack(); }
});
$("#sec-stack").addEventListener("input", ev => {
  const t = ev.target; if (!t.dataset.e || t.tagName === "SELECT") return;
  const k = t.dataset.e;
  updateItem(state.editItem, { [k]: ["dose", "cycleWeeks", "vialMg", "waterMl"].includes(k) ? (t.value === "" ? null : num(t.value)) : t.value });
  const el = $("#e-calc"), it = items().find(x => x.id === state.editItem);
  if (el && it) el.innerHTML = calcText(it);
});
$("#sec-stack").addEventListener("change", ev => {
  const t = ev.target; if (!t.dataset.e || t.tagName !== "SELECT") return;
  updateItem(state.editItem, { [t.dataset.e]: t.dataset.e === "weekday" ? +t.value : t.value });
  renderStack();
});
renderOnLeave($("#sec-stack"), "input[data-e]", () => renderStack());

// =====================================================================
// Navigation
// =====================================================================
function showView(v) {
  state.view = v; store.set("gym.view", v);
  for (const k of ["log", "prog", "hist"]) $("#view-" + k).hidden = k !== v;
  document.querySelectorAll("#sec-training [data-view]").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === v));
  if (v === "log") renderLog(); else if (v === "prog") renderProg(); else renderHist();
}
function showNView(v) {
  state.nview = v; store.set("gym.nview", v);
  for (const k of ["day", "stats", "goal"]) $("#nview-" + k).hidden = k !== v;
  document.querySelectorAll("#sec-essen [data-nview]").forEach(b => b.setAttribute("aria-pressed", b.dataset.nview === v));
  if (v === "day") renderNDay(); else if (v === "stats") renderNStats(); else renderNGoal();
}
function showSec(s, scroll = true) {
  const changed = state.sec !== s;
  state.sec = s; store.set("gym.sec2", s);
  for (const k of SECS) $("#sec-" + k).hidden = k !== s;
  document.querySelectorAll(".nav [data-sec]").forEach(b => b.setAttribute("aria-selected", b.dataset.sec === s));
  $("#page-title").textContent = TITLES[s];
  $("#today-label").textContent = longDate(today());
  if (s === "heute") renderHeute(); else if (s === "training") showView(state.view); else if (s === "essen") showNView(state.nview); else if (s === "schlaf") renderSleep(); else renderStack();
  if (changed && scroll) scrollTo(0, 0);
}
function renderCurrent() {
  const a = document.activeElement;
  const typing = a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT") && a.type !== "date";
  if (typing) return;   // don't pull the field away mid-entry; the next render picks it up
  showSec(state.sec, false);
}
document.querySelector(".nav").addEventListener("click", ev => { const b = ev.target.closest("[data-sec]"); if (b) { flushAll(); state.confirmDel = null; state.editItem = null; showSec(b.dataset.sec); } });
document.querySelector("#sec-training > .seg").addEventListener("click", ev => { const b = ev.target.closest("[data-view]"); if (b) { flushAll(); showView(b.dataset.view); } });
document.querySelector("#sec-essen > .seg").addEventListener("click", ev => { const b = ev.target.closest("[data-nview]"); if (b) { flushAll(); showNView(b.dataset.nview); } });
addEventListener("hashchange", () => { const h = location.hash.slice(1); if (SECS.includes(h)) showSec(h); });
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => renderCurrent(), 150); });
// Roll over to the new day when the app is reopened after midnight
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  const t = today();
  if (state.lastToday && state.lastToday !== t) { state.hdate = state.ndate = state.sdate = state.date = t; state.day = dayOfDate(t).key; loadDraft(); renderCurrent(); }
  state.lastToday = t;
});
state.lastToday = today();
function tick() { const d = new Date(); $("#clock").textContent = `${wdName(today())}, ${fmtDate(today())} · ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
tick(); setInterval(tick, 15000);

loadDraft();
showSec(state.sec, false);

// =====================================================================
// Storage
// =====================================================================
(async () => {
  const has = window.claude && window.claude.use;
  const [db, sample] = has ? await Promise.all([window.claude.use("db"), window.claude.use("sample")]) : [null, null];
  state.sample = sample;
  if (!db) {
    setStatus("Offline", true);
    const bn = $("#banner"); bn.hidden = false;
    bn.textContent = "Der Speicher ist in dieser Ansicht nicht erreichbar. Öffne die Seite über claude.ai und melde dich an, damit deine Einträge gespeichert werden.";
    renderCurrent();
    return;
  }
  state.db = db;
  setStatus("Bereit");
  const onErr = () => setStatus("Verbindung verloren – Seite neu laden", true);
  const mapColl = (name, key, fix) => db.collection(name).orderBy("date", "desc").limit(1000).onSnapshot(snap => {
    const next = {};
    for (const d of snap.docs) { const x = structuredClone(d.data()); fix && fix(x); next[d.id] = x; }
    for (const k in state[key]) if (pending(name, k)) next[k] = state[key][k];   // keep local edits in flight
    state[key] = next;
    renderCurrent();
  }, onErr);
  db.collection("sessions").orderBy("date", "desc").limit(1000).onSnapshot(snap => {
    state.sessions = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => a.date === b.date ? (a.updatedAt < b.updatedAt ? 1 : -1) : (a.date < b.date ? 1 : -1));
    if (!pending("sessions", sessionId(draft.date, draft.day))) loadDraft();
    renderCurrent();
  }, onErr);
  mapColl("nutrition", "nutrition", x => { if (!Array.isArray(x.meals)) x.meals = []; });
  mapColl("sleep", "sleep", x => { if (!x.mins) x.mins = sleepMins(x.bed, x.wake); });
  mapColl("days", "days", x => { x.stack = x.stack || {}; x.cardio = x.cardio || []; x.caffeine = x.caffeine || []; });
  const single = (path, key, coll, id) => db.doc(path).onSnapshot(snap => {
    if (!pending(coll, id)) state[key] = snap.exists ? structuredClone(snap.data()) : null;
    renderCurrent();
  }, onErr);
  single("profile/me", "profile", "profile", "me");
  single("stack/config", "stack", "stack", "config");
  single("favorites/list", "favs", "favorites", "list");
})();
</script>
